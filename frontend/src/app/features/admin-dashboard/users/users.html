<section class="panel">
  <div class="panel-head">
    <p class="eyebrow">People</p>
    <h2>Users</h2>
    <p>Review customer accounts and update access from the same dark control language.</p>
  </div>

  <label class="search-box" for="user-search">
    <span class="search-label">Search people</span>
    <input
      id="user-search"
      type="search"
      [(ngModel)]="searchTerm"
      placeholder="Search by name, email, or role"
      aria-label="Search people"
    />
  </label>

  <div class="list" *ngIf="visibleUsers.length; else noUsers">
    <article class="user-card" *ngFor="let user of visibleUsers">
      <div>
        <p class="name">{{ user.first_name }} {{ user.last_name }}</p>
        <p class="meta">{{ user.email }}</p>
      </div>

      <div class="actions">
        <span class="role">{{ user.role }}</span>
        <select [value]="'active'" (change)="statusChange.emit({ id: user.id, status: $any($event.target).value })">
          <option value="active">Active</option>
          <option value="suspended">Suspended</option>
        </select>
      </div>
    </article>
  </div>

  <ng-template #noUsers>
    <div class="empty-state">
      <p>No people match your search.</p>
    </div>
  </ng-template>
</section>
